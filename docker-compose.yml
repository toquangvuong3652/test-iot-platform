# ============================================================================
# IoT Platform — Base v1 (docker-compose).
#
# Services: db (postgres 16) · emqx (EMQX 5 broker) · api (NestJS :3000)
#           consumer (mqtt uplink + socket.io :3001) · web (Next.js :3002)
#
# Secrets / config come from a repo-root `.env` (see `.env.example` — copy it
# and fill in real values; never commit a real `.env`). The values here are
# read by COMPOSE (variable interpolation) and passed to each service
# explicitly, so each service only sees the vars it needs.
#
#   docker compose up --build
#
# Note: EMQX substitutes ${MQTT_AUTH_INTERNAL_SECRET} in its own container
# env (infra/emqx/emqx.conf), so it MUST be set on the emqx service below.
# ============================================================================

services:
  # ---- PostgreSQL 16 ------------------------------------------------------
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Exposed for local tooling (Prisma Studio). Remove in prod if unneeded.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---- EMQX 5 broker ------------------------------------------------------
  emqx:
    image: emqx/emqx:5.8.3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/emqx/entrypoint.sh"]
    # EMQX reads its own container env for the ${MQTT_AUTH_INTERNAL_SECRET}
    # placeholder in the mounted emqx.conf (the api's /mqtt/auth + /mqtt/acl
    # headers). EMQX_NODE_NAME keeps the node name deterministic (5.8.3
    # default derives it from the container IP — `emqx@127.0.0.1@<ip>`).
    environment:
      EMQX_NODE_NAME: emqx@127.0.0.1
      MQTT_AUTH_INTERNAL_SECRET: ${MQTT_AUTH_INTERNAL_SECRET}
    volumes:
      - ./infra/emqx/emqx.conf.template:/opt/emqx/etc/emqx.conf.template:ro
      - ./infra/emqx/entrypoint.sh:/opt/emqx/entrypoint.sh:ro
      - emqx-data:/opt/emqx/data
    ports:
      # Host ports remapped (11883/18084) because a host-local mosquitto
      # occupies 1883 on this machine. Inside the compose network the broker
      # is still emqx:1883 (services talk to the container port, not these).
      # Free them back to 1883/8084 on a host without a local broker.
      - "11883:1883"  # MQTT (plain) — local devices / smoke tests
      - "18084:8084"  # WSS — devices behind the Cloudflare Tunnel
    healthcheck:
      # `emqx_ctl status` exits 0 when the node is started, non-zero otherwise.
      # (`emqx_ctl ping` is NOT a valid 5.8.3 subcommand — it prints help and
      # exits 1, so the previous healthcheck failed every tick even on a
      # healthy broker.)
      test: ["CMD", "emqx_ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---- NestJS API ---------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      emqx:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-iot}:${POSTGRES_PASSWORD:-iot}@db:5432/${POSTGRES_DB:-iot}
      MQTT_BROKER: mqtt://emqx:1883
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      COMMAND_ACK_TIMEOUT_MS: ${COMMAND_ACK_TIMEOUT_MS:-15000}
      MQTT_AUTH_INTERNAL_SECRET: ${MQTT_AUTH_INTERNAL_SECRET}
      PLATFORM_MQTT_TOKEN: ${PLATFORM_MQTT_TOKEN}
      # Comma-separated public origins the dashboard (web) may call.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3002}
    ports:
      - "3000:3000"
    # CMD (in the Dockerfile) already runs `prisma migrate deploy` before start.
    # Node is guaranteed in the image, so the liveness probe uses fetch.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---- MQTT uplink consumer + realtime gateway ----------------------------
  consumer:
    build:
      context: .
      dockerfile: apps/consumer/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      emqx:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-iot}:${POSTGRES_PASSWORD:-iot}@db:5432/${POSTGRES_DB:-iot}
      MQTT_BROKER: mqtt://emqx:1883
      JWT_SECRET: ${JWT_SECRET}
      PLATFORM_MQTT_TOKEN: ${PLATFORM_MQTT_TOKEN}
    ports:
      - "3001:3001"

  # ---- Next.js dashboard --------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Baked into the client bundle at build time (see Dockerfile ARGs).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      consumer:
        condition: service_started
    ports:
      - "3002:3002"

volumes:
  db-data:
  emqx-data:
