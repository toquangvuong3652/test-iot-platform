name: iot-platform
services:
  api:
    build:
      context: C:\Users\AD\iot-platform
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        required: true
      emqx:
        condition: service_healthy
        required: true
    environment:
      COMMAND_ACK_TIMEOUT_MS: "15000"
      CORS_ORIGIN: http://localhost:3002
      DATABASE_URL: postgresql://iot:iot@db:5432/iot
      JWT_EXPIRES_IN: 15m
      JWT_SECRET: j5n8r3v6localdevjwtsecret0927331
      MQTT_AUTH_INTERNAL_SECRET: 8f3k2m9xlocaldevinternalauthsecret01
      MQTT_BROKER: mqtt://emqx:1883
      NODE_ENV: production
      PLATFORM_MQTT_TOKEN: p7t2q9w4localdevplatformmqtttoken1
      PORT: "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      timeout: 5s
      interval: 10s
      retries: 12
      start_period: 30s
    networks:
      default: null
    ports:
      - mode: ingress
        target: 3000
        published: "3000"
        protocol: tcp
    restart: unless-stopped
  consumer:
    build:
      context: C:\Users\AD\iot-platform
      dockerfile: apps/consumer/Dockerfile
    depends_on:
      db:
        condition: service_healthy
        required: true
      emqx:
        condition: service_healthy
        required: true
    environment:
      DATABASE_URL: postgresql://iot:iot@db:5432/iot
      JWT_SECRET: j5n8r3v6localdevjwtsecret0927331
      MQTT_BROKER: emqx:1883
      NODE_ENV: production
      PLATFORM_MQTT_TOKEN: p7t2q9w4localdevplatformmqtttoken1
      PORT: "3001"
    networks:
      default: null
    ports:
      - mode: ingress
        target: 3001
        published: "3001"
        protocol: tcp
    restart: unless-stopped
  db:
    environment:
      POSTGRES_DB: iot
      POSTGRES_PASSWORD: iot
      POSTGRES_USER: iot
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 5s
      interval: 5s
      retries: 12
      start_period: 10s
    image: postgres:16
    networks:
      default: null
    ports:
      - mode: ingress
        target: 5432
        published: "5432"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: db-data
        target: /var/lib/postgresql/data
        volume: {}
  emqx:
    environment:
      EMQX_NODE_NAME: emqx@127.0.0.1
      MQTT_AUTH_INTERNAL_SECRET: 8f3k2m9xlocaldevinternalauthsecret01
    healthcheck:
      test:
        - CMD
        - emqx_ctl
        - status
      timeout: 5s
      interval: 10s
      retries: 12
      start_period: 20s
    image: emqx/emqx:5.8.3
    networks:
      default: null
    ports:
      - mode: ingress
        target: 1883
        published: "11883"
        protocol: tcp
      - mode: ingress
        target: 8084
        published: "18084"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: C:\Users\AD\iot-platform\infra\emqx\emqx.conf
        target: /opt/emqx/etc/emqx.conf
        read_only: true
        bind: {}
      - type: volume
        source: emqx-data
        target: /opt/emqx/data
        volume: {}
  web:
    build:
      context: C:\Users\AD\iot-platform
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
        NEXT_PUBLIC_WS_URL: http://localhost:3001
    depends_on:
      api:
        condition: service_started
        required: true
      consumer:
        condition: service_started
        required: true
    networks:
      default: null
    ports:
      - mode: ingress
        target: 3002
        published: "3002"
        protocol: tcp
    restart: unless-stopped
networks:
  default:
    name: iot-platform_default
volumes:
  db-data:
    name: iot-platform_db-data
  emqx-data:
    name: iot-platform_emqx-data
